# CI-only Compose override.
#
# MinIO deleted its community images from Docker Hub in September 2026 and closed
# the Quay mirror, so a fresh `docker compose up` can no longer pull
# `minio/minio` or `minio/mc`. A host that already runs the pinned images (such
# as the staging host) is unaffected, so the production compose keeps them.
#
# This override swaps in Bitnami's archived MinIO build — the same server binary,
# plus its bundled `mc` — for the browser-test job, which needs to start the
# stack on a clean runner. It runs the `minio` binary directly as root so it can
# write the root-owned `minio-data` volume, and is never used for a real deploy.
services:
  minio:
    image: bitnamilegacy/minio:latest
    entrypoint: ["/opt/bitnami/minio/bin/minio"]
    command: ["server", "/data", "--console-address", ":9001"]
    user: root
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  minio-init:
    image: bitnamilegacy/minio:latest
    entrypoint: >
      /bin/sh -c "
      export PATH=/opt/bitnami/minio-client/bin:$$PATH;
      mc alias set local $$S3_ENDPOINT $$S3_ACCESS_KEY $$S3_SECRET_KEY;
      mc mb --ignore-existing local/$$S3_BUCKET_UPLOADS;
      mc mb --ignore-existing local/$$S3_BUCKET_EXPORTS;
      mc mb --ignore-existing local/$$S3_BUCKET_ARTIFACTS;
      mc version enable local/$$S3_BUCKET_UPLOADS;
      mc version enable local/$$S3_BUCKET_EXPORTS;
      mc version enable local/$$S3_BUCKET_ARTIFACTS;
      "

name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prod-check:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: packetchat
          POSTGRES_PASSWORD: packetchat
          POSTGRES_DB: packetchat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U packetchat -d packetchat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgres://packetchat:packetchat@localhost:5432/packetchat
      AUTH_DB_TEST_DATABASE_URL: postgres://packetchat:packetchat@localhost:5432/packetchat
      # Integration tests skip themselves when this is unset. CI already runs a
      # Postgres service, so point them at it rather than letting them no-op.
      TEST_DATABASE_URL: postgres://packetchat:packetchat@localhost:5432/packetchat
      PACKETCHAT_AUTH_DB_TEST: "1"
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
      S3_BUCKET_UPLOADS: test-uploads
      S3_BUCKET_EXPORTS: test-exports
      S3_BUCKET_ARTIFACTS: test-artifacts
      BOOTSTRAP_TOKEN: test-bootstrap-token
      ENCRYPTION_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      JWT_SECRET: test-jwt-secret-with-at-least-32-bytes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Run production gate
        run: npm run prod:check

  compose-check:
    name: Validate Docker Compose build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare Compose env
        run: cp .env.example .env

      - name: Validate Compose config
        run: npm run compose:config

      - name: Build Compose application images
        run: npm run compose:build

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Prepare Compose env
        run: |
          cp .env.example .env
          # The suite loads many pages and each load refreshes the session, so the
          # default 20/min auth limit is too tight for a full run against one IP.
          sed -i 's/^RATE_LIMIT_AUTH_PER_MINUTE=.*/RATE_LIMIT_AUTH_PER_MINUTE=600/' .env

      - name: Start the stack
        run: npm run compose:up:ci

      - name: Run migrations
        run: npm run compose:migrate:ci

      - name: Wait for readiness and bootstrap the admin
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/readyz || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          curl -sS -X POST http://localhost:3000/api/admin/bootstrap \
            -H 'Content-Type: application/json' \
            -d '{"bootstrapToken":"change-me-before-deploy","email":"admin@example.com","displayName":"Admin","password":"PacketChat-Ci-Admin-2026!"}'

      - name: Run browser tests
        env:
          PACKETCHAT_BASE_URL: http://localhost:3000
          PACKETCHAT_E2E_EMAIL: admin@example.com
          PACKETCHAT_E2E_PASSWORD: PacketChat-Ci-Admin-2026!
        run: npm run test:e2e

      - name: Stack logs on failure
        if: failure()
        run: docker compose --env-file .env -f infrastructure/compose/docker-compose.yml -f infrastructure/compose/docker-compose.ci.yml logs --tail 120 || true

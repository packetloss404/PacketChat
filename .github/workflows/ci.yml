name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prod-check:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: packetchat
          POSTGRES_PASSWORD: packetchat
          POSTGRES_DB: packetchat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U packetchat -d packetchat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgres://packetchat:packetchat@localhost:5432/packetchat
      AUTH_DB_TEST_DATABASE_URL: postgres://packetchat:packetchat@localhost:5432/packetchat
      PACKETCHAT_AUTH_DB_TEST: "1"
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
      S3_BUCKET_UPLOADS: test-uploads
      S3_BUCKET_EXPORTS: test-exports
      S3_BUCKET_ARTIFACTS: test-artifacts
      BOOTSTRAP_TOKEN: test-bootstrap-token
      ENCRYPTION_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      JWT_SECRET: test-jwt-secret-with-at-least-32-bytes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Run production gate
        run: npm run prod:check

  compose-check:
    name: Validate Docker Compose build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare Compose env
        run: cp .env.example .env

      - name: Validate Compose config
        run: npm run compose:config

      - name: Build Compose application images
        run: npm run compose:build

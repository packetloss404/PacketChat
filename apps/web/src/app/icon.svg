<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="PacketChat">
  <defs>
    <linearGradient id="pc" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d97757"/>
      <stop offset="1" stop-color="#a94f2f"/>
    </linearGradient>
    <!-- A chat bubble carrying three packets. The packets are knocked out as
         real transparency rather than filled with the app background, so the
         mark sits correctly on light and dark surfaces alike. -->
    <mask id="pcmask">
      <rect x="2" y="5" width="28" height="18" rx="6" fill="#fff"/>
      <path d="M9 21 L17 21 L6.5 29 Z" fill="#fff"/>
      <rect x="7" y="12" width="4" height="4" rx="1.1" fill="#000"/>
      <rect x="14" y="12" width="4" height="4" rx="1.1" fill="#000"/>
      <rect x="21" y="12" width="4" height="4" rx="1.1" fill="#000"/>
    </mask>
  </defs>
  <rect width="32" height="32" fill="url(#pc)" mask="url(#pcmask)"/>
</svg>
